<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Mona Sans Variable";
  font-weight: 200 900;
  font-stretch: 75% 125%;
  font-display: block;
  src: url(../../apps/site/src/assets/fonts/mona-sans-core.woff2) format("woff2-variations");
}
@font-face {
  font-family: "Martian Mono Variable";
  font-weight: 100 800;
  font-stretch: 75% 112.5%;
  font-display: block;
  src: url(../../apps/site/src/assets/fonts/martian-mono-core.woff2) format("woff2-variations");
}
:root {
  --paper: #f1ece2;
  --paper-deep: #e6dfd1;
  --ink: #16130f;
  --ink-2: #57524a;
  --poster: "Mona Sans Variable", "Arial Narrow", sans-serif;
  --mono: "Martian Mono Variable", ui-monospace, "SF Mono", monospace;
}
html, body { margin: 0; }
body { width: 660px; height: 460px; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
body > * { position: absolute; margin: 0; }
.head { left: 28px; top: 18px; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.head img { width: 24px; height: 24px; display: block; }
.word { font-family: var(--poster); font-weight: 880; font-stretch: 120%; font-size: 18px; letter-spacing: -0.04em; line-height: 1; }
.tag { margin-left: 6px; font-family: var(--mono); font-stretch: 87.5%; font-weight: 460; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); line-height: 1; }
.hl { left: 26px; top: 56px; font-family: var(--poster); font-stretch: 75%; font-weight: 900; font-size: 96px; line-height: 0.85; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
.arrow { left: 262px; top: 193px; }
.plate { top: 270px; width: 112px; height: 24px; margin-left: -56px; border-radius: 12px; background: var(--paper-deep); }
</style>
</head>
<body>
<div class="head"><img src="../../apps/site/src/assets/app-icon.png" alt=""><span class="word">astro</span><span class="tag">A free Chromium browser by Oxy</span></div>
<span class="hl">Drag it in.</span>
<svg class="arrow" width="136" height="30" viewBox="0 -3 136 30" fill="none"><path d="M0 12h120M110 2l14 10-14 10" stroke="#16130f" stroke-width="5" stroke-linecap="square"/></svg>
<div class="plate" style="left:176px"></div>
<div class="plate" style="left:484px"></div>
<script>
document.fonts.ready.then(() => {
  document.body.dataset.fonts = [...document.fonts].filter((f) => f.status === "loaded").map((f) => f.family).join(",");
});
</script>
</body>
</html>
