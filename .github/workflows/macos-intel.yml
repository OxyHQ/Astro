name: macOS Intel build

on:
  push:
    branches: [ci/macos-intel]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A push while the engine builds queues behind it instead of cancelling a day of compiling; the queued run then reuses
# the engine if engine/ didn't change.
concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      engine_key: ${{ steps.keys.outputs.engine_key }}
      state_key: ${{ steps.keys.outputs.state_key }}
      engine_run: ${{ steps.lookup.outputs.engine_run }}
      state_run: ${{ steps.lookup.outputs.state_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The engine is rebuilt only when what it's built from changes; a tree left by an earlier run with the same
      # patch series and preparation resumes instead of starting over.
      - id: keys
        run: |
          engine=$(git rev-parse HEAD:engine HEAD:apps/browser/assets/offline-game HEAD:apps/browser/assets/offline-game-pipeline | shasum -a 256 | cut -c1-16)
          state=$(git rev-parse HEAD:engine/patches HEAD:engine/astrocore/apply.sh HEAD:scripts/ci/macos-engine-prepare.sh | shasum -a 256 | cut -c1-16)
          echo "engine_key=$engine" >> "$GITHUB_OUTPUT"
          echo "state_key=$state" >> "$GITHUB_OUTPUT"
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty'
          }
          engine_run=$(newest "astrocore-macos-x64-${{ steps.keys.outputs.engine_key }}")
          state_run=""
          [ -n "$engine_run" ] || state_run=$(newest "engine-state-${{ steps.keys.outputs.state_key }}")
          echo "engine_run=$engine_run" >> "$GITHUB_OUTPUT"
          echo "state_run=$state_run" >> "$GITHUB_OUTPUT"
          echo "engine from run: ${engine_run:-none (build it)}; tree from run: ${state_run:-none (sync it)}" | tee -a "$GITHUB_STEP_SUMMARY"

  engine_1:
    needs: plan
    if: needs.plan.outputs.engine_run == ''
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 1
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ needs.plan.outputs.state_run }}
  engine_2:
    needs: [plan, engine_1]
    if: needs.engine_1.outputs.status == 'running'
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 2
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ github.run_id }}
  engine_3:
    needs: [plan, engine_2]
    if: needs.engine_2.outputs.status == 'running'
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 3
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ github.run_id }}
  engine_4:
    needs: [plan, engine_3]
    if: needs.engine_3.outputs.status == 'running'
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 4
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ github.run_id }}
  engine_5:
    needs: [plan, engine_4]
    if: needs.engine_4.outputs.status == 'running'
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 5
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ github.run_id }}
  engine_6:
    needs: [plan, engine_5]
    if: needs.engine_5.outputs.status == 'running'
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 6
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ github.run_id }}
  engine_7:
    needs: [plan, engine_6]
    if: needs.engine_6.outputs.status == 'running'
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 7
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ github.run_id }}
  engine_8:
    needs: [plan, engine_7]
    if: needs.engine_7.outputs.status == 'running'
    uses: ./.github/workflows/macos-intel-engine-phase.yml
    with:
      phase: 8
      engine_key: ${{ needs.plan.outputs.engine_key }}
      state_key: ${{ needs.plan.outputs.state_key }}
      state_run: ${{ github.run_id }}

  app:
    needs: [plan, engine_1, engine_2, engine_3, engine_4, engine_5, engine_6, engine_7, engine_8]
    if: >-
      always() && !cancelled() && (needs.plan.outputs.engine_run != '' ||
      needs.engine_1.outputs.status == 'finished' || needs.engine_2.outputs.status == 'finished' ||
      needs.engine_3.outputs.status == 'finished' || needs.engine_4.outputs.status == 'finished' ||
      needs.engine_5.outputs.status == 'finished' || needs.engine_6.outputs.status == 'finished' ||
      needs.engine_7.outputs.status == 'finished' || needs.engine_8.outputs.status == 'finished')
    # The app needs the macOS 27 SDK (Xcode 27 runs only on Apple silicon); it still builds x86_64.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      AC_CI_XCODE: /Applications/Xcode_27.1.app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare the runner
        run: scripts/ci/macos-runner-prep.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: pnpm
        run: npm install -g "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - uses: actions/download-artifact@v8
        with:
          name: astrocore-macos-x64-${{ needs.plan.outputs.engine_key }}
          path: ${{ runner.temp }}/engine
          run-id: ${{ needs.plan.outputs.engine_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Unpack the engine
        run: |
          tar -C "$RUNNER_TEMP/engine" -xf "$RUNNER_TEMP/engine/astrocore-macos-x64.tar.zst" --use-compress-program "zstd -d"
          echo "engine tree $(cat "$RUNNER_TEMP/engine/engine-tree"), this checkout's $(git rev-parse HEAD:engine)"
      - name: Build and package Astro.app (x86_64)
        run: scripts/ci/macos-app-build.sh --arch x86_64 --framework "$RUNNER_TEMP/engine/Chromium Framework.framework" --out "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: Astro-macos-x86_64-dmg
          path: |
            ${{ runner.temp }}/dist/*.dmg
            ${{ runner.temp }}/dist/*.dmg.sha256
          retention-days: 30
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-build-log
          path: ${{ runner.temp }}/dist/build.log
          retention-days: 14

  smoke:
    needs: app
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Astro-macos-x86_64-dmg
          path: ${{ runner.temp }}/dmg
      - name: Install from the disk image and launch
        run: scripts/ci/macos-smoke-test.sh "$(ls "$RUNNER_TEMP"/dmg/*.dmg)" "$RUNNER_TEMP/smoke" 45
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: ${{ runner.temp }}/smoke
          retention-days: 30
