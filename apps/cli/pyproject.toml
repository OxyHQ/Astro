[project]
name = "astro-cli"
version = "0.0.0.dev0"
description = "The astro command: drive a running Astro from Python."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "aiofiles==25.1.0",
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.5",
  "aiosignal==1.4.0",
  "annotated-types==0.8.0",
  "attrs==26.1.0",
  "frozenlist==1.8.0",
  "idna==3.20",
  "multidict==7.1.0",
  "propcache==0.5.4",
  "pydantic==2.14.1",
  "pydantic-core==2.50.1",
  "pydoll-python==3.0.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "websockets==16.1.1",
  "yarl==1.25.1",
]

[project.scripts]
astro = "astro_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
