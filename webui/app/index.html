<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Lets the user agent paint its own surface in the right scheme for the
         frame before the bundle runs and Bloom writes the theme tokens. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Replaced by the page's own title once the host is resolved; a page
         whose title never changes is a page that failed to mount. -->
    <title>Astro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
