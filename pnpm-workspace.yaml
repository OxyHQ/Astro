packages:
  - apps/*
  - packages/*
  - "!apps/site"
  - "!apps/dashboard"
  - "!apps/videos"

nodeLinker: hoisted

autoInstallPeers: false

overrides:
  '@expo/metro-config>lightningcss': 1.30.1
  '@expo/metro-config>postcss': ^8.5.23
  '@expo/metro>metro': 0.83.8
  '@expo/metro>metro-babel-transformer': 0.83.8
  '@expo/metro>metro-cache': 0.83.8
  '@expo/metro>metro-cache-key': 0.83.8
  '@expo/metro>metro-config': 0.83.8
  '@expo/metro>metro-core': 0.83.8
  '@expo/metro>metro-file-map': 0.83.8
  '@expo/metro>metro-minify-terser': 0.83.8
  '@expo/metro>metro-resolver': 0.83.8
  '@expo/metro>metro-runtime': 0.83.8
  '@expo/metro>metro-source-map': 0.83.8
  '@expo/metro>metro-symbolicate': 0.83.8
  '@expo/metro>metro-transform-plugins': 0.83.8
  '@expo/metro>metro-transform-worker': 0.83.8
  'xcode>uuid': ^11.1.1

patchedDependencies:
  expo-constants@18.0.14: patches/expo-constants@18.0.14.patch
  expo-modules-core@3.0.30: patches/expo-modules-core@3.0.30.patch
  react-native-macos@0.81.9: patches/react-native-macos@0.81.9.patch

allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - '@alia.onl/sdk@22.8.0'
  - '@oxy.so/bloom@15.65.0'
  - '@oxy.so/contracts@6.0.0'
  - '@oxy.so/core@7.1.0 || 7.2.0'
  - '@oxy.so/protocol@1.5.1'
  - '@oxy.so/services@13.0.0 || 13.4.0'
